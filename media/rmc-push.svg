<!--
  Activity bar icon: the two-peak flame from the extension artwork, with an
  upward arrow knocked out of it for the "push" action.

  VS Code renders this strip at ~24px and recolours it per theme and per
  idle/active state, so the icon must be flat, monochrome, and bound to
  currentColor. Nothing here may carry a literal colour — a hardcoded fill would
  survive theming as a wrongly-coloured block on light and high-contrast themes.

  The arrow is a second subpath in the same `d`, cut out by fill-rule="evenodd"
  rather than painted over the flame. Painting it would require knowing the
  background colour, which is exactly what theming makes unknowable.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <path fill="currentColor" fill-rule="evenodd"
        d="M9.8 2.2 12.4 7.6 14.8 4.6 19 13.4 12 21.4 5 13.4Z
           M12 9.6 8.6 13.4h2.2v4.2h2.4v-4.2h2.2Z"/>
</svg>
